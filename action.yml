name: "Send ClickUp Notification Action"
description: "Fetches commit history (if possible) and sends a notification to ClickUp."

branding:
  icon: "bell"
  color: "orange"

inputs:
  clickup_api_token:
    description: "ClickUp API Token"
    required: true
  clickup_workspace_id:
    description: "ClickUp Workspace ID"
    required: true
  clickup_channel_id:
    description: "ClickUp Channel ID"
    required: true
  clickup_project_name:
    description: "ClickUp Project Name for the message"
    required: true
  title:
    description: "Custom title for the notification message"
    required: false
    default: ""
  description:
    description: "Custom description for the notification message"
    required: false
    default: ""
  show_fetch_duration:
    description: "Show duration information in the notification"
    required: false
    default: "true"
  show_changelog_commits:
    description: "Show changelog commits in the notification"
    required: false
    default: "true"
  full_commit_message:
    description: "Use the full commit message instead of the first line"
    required: false
    default: "true"
  show_commit_statistics:
    description: "Show commit statistics in the notification"
    required: false
    default: "false"
  test_mode:
    description: "Test mode - preview message without sending to ClickUp"
    required: false
    default: "false"
  filter_agent_commits:
    description: "Filter out agent-generated commits (Initial plan, Agent-Logs-Url, Co-authored-by)"
    required: false
    default: "true"
  group_commits_by_type:
    description: "Group commits by conventional commit type instead of by author"
    required: false
    default: "false"
  show_pr_links:
    description: "Show PR links next to commit references"
    required: false
    default: "false"
  show_compare_link:
    description: "Add a 'View full diff' link to the GitHub compare page below the changelog"
    required: false
    default: "false"
  max_commits:
    description: "Maximum number of commits to list; older ones are summarized as '…and N more'. Empty or 0 shows all"
    required: false
    default: ""
  since_ref:
    description: "Tag, branch or SHA to start the changelog from when no previous successful run exists (default: last 30 days)"
    required: false
    default: ""
  staging_emoji:
    description: "Emoji used for staging branch notifications"
    required: false
    default: "🧪"
  production_emoji:
    description: "Emoji used for production branch notifications"
    required: false
    default: "🚀"
  environment_emojis:
    description: "Optional '<branch glob>=<emoji>' lines (e.g. 'release/beta=🅱️'); first match wins over staging/production emojis"
    required: false
    default: ""
  notify_on_failure:
    description: "Send notification when workflow fails (use with workflow_status input)"
    required: false
    default: "false"
  notify_on_cancel:
    description: "Send notification when workflow is cancelled (use with workflow_status input)"
    required: false
    default: "false"
  workflow_status:
    description: "Current job status (pass job.status): success, failure or cancelled"
    required: false
    default: "success"

outputs:
  message_id:
    description: "ID of the created ClickUp chat message (empty in test mode, when skipped, or if not returned)"
    value: ${{ steps.notify.outputs.message_id }}
  message:
    description: "The message content that was sent or previewed (empty when skipped)"
    value: ${{ steps.notify.outputs.message }}
  commit_count:
    description: "Number of commits in the changelog range, before filtering (empty when the changelog is disabled)"
    value: ${{ steps.commits.outputs.commit_count }}
  previous_sha:
    description: "Base commit SHA of the changelog range (empty if none)"
    value: ${{ steps.commits.outputs.previous_sha }}
  compare_url:
    description: "GitHub compare URL for the changelog range (empty if none)"
    value: ${{ steps.commits.outputs.compare_url }}

runs:
  using: "composite"
  steps:
    - name: 🚦 Resolve Workflow Status
      id: status
      shell: bash
      env:
        WORKFLOW_STATUS: ${{ inputs.workflow_status }}
        NOTIFY_ON_FAILURE: ${{ inputs.notify_on_failure }}
        NOTIFY_ON_CANCEL: ${{ inputs.notify_on_cancel }}
      run: |
        STATUS=$(printf '%s' "$WORKFLOW_STATUS" | tr '[:upper:]' '[:lower:]')
        case "$STATUS" in
          failure|cancelled) ;;
          *) STATUS="success" ;;
        esac

        NOTIFY="true"
        if [ "$STATUS" = "failure" ] && [ "$NOTIFY_ON_FAILURE" != "true" ]; then
          NOTIFY="false"
          echo "Workflow failed and notify_on_failure is not enabled - skipping notification."
        fi
        if [ "$STATUS" = "cancelled" ] && [ "$NOTIFY_ON_CANCEL" != "true" ]; then
          NOTIFY="false"
          echo "Workflow was cancelled and notify_on_cancel is not enabled - skipping notification."
        fi

        echo "status=$STATUS" >> "$GITHUB_OUTPUT"
        echo "notify=$NOTIFY" >> "$GITHUB_OUTPUT"

    - name: ⏱️ Fetch Duration
      id: duration
      if: ${{ steps.status.outputs.notify == 'true' && inputs.show_fetch_duration == 'true' }}
      uses: architweb/ClickUpNotification/steps/fetch-duration@v3.3.0

    - name: 📝 Fetch Commits
      id: commits
      if: ${{ steps.status.outputs.notify == 'true' && steps.status.outputs.status == 'success' && inputs.show_changelog_commits == 'true' }}
      uses: architweb/ClickUpNotification/steps/fetch-commits@v3.3.0
      with:
        full_commit_message: ${{ inputs.full_commit_message }}
        show_commit_statistics: ${{ inputs.show_commit_statistics }}
        filter_agent_commits: ${{ inputs.filter_agent_commits }}
        group_commits_by_type: ${{ inputs.group_commits_by_type }}
        show_pr_links: ${{ inputs.show_pr_links }}
        clickup_workspace_id: ${{ inputs.clickup_workspace_id }}
        since_ref: ${{ inputs.since_ref }}
        max_commits: ${{ inputs.max_commits }}
        show_compare_link: ${{ inputs.show_compare_link }}

    - name: 📢 Send ClickUp Notification
      id: notify
      if: ${{ steps.status.outputs.notify == 'true' }}
      uses: architweb/ClickUpNotification/steps/send-notification@v3.3.0
      with:
        clickup_api_token: ${{ inputs.clickup_api_token }}
        clickup_workspace_id: ${{ inputs.clickup_workspace_id }}
        clickup_channel_id: ${{ inputs.clickup_channel_id }}
        clickup_project_name: ${{ inputs.clickup_project_name }}
        title: ${{ inputs.title }}
        description: ${{ inputs.description }}
        test_mode: ${{ inputs.test_mode }}
        workflow_status: ${{ steps.status.outputs.status }}
        staging_emoji: ${{ inputs.staging_emoji }}
        production_emoji: ${{ inputs.production_emoji }}
        environment_emojis: ${{ inputs.environment_emojis }}
        formatted_duration: ${{ steps.duration.outputs.formatted_duration || 'unknown' }}
        commit_file: ${{ steps.commits.outputs.commit_file }}
