name: Create Release

on:
  push:
    branches:
      - release/production

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: "release/production"
          fetch-depth: 0

      - name: 📦 Get version from CHANGELOG
        id: package-info
        run: |
          VERSION=$(grep -m 1 "## \[v" CHANGELOG | sed -n 's/^## \[\(v[^]]*\)\].*/\1/p')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract version from CHANGELOG"
            exit 1
          fi
          NAME=$(basename "$GITHUB_REPOSITORY")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Found version: $VERSION"

      - name: 📄 Extract latest changelog
        id: changelog
        run: |
          START_LINE=$(grep -n "^## \[v[0-9]*\.[0-9]*\.[0-9]*\]" CHANGELOG | head -1 | cut -d: -f1)

          if [ -z "$START_LINE" ]; then
            echo "No version sections found in CHANGELOG"
            echo "" > changelog_section.md
          else
            NEXT_LINE=$(grep -n "^## \[v[0-9]*\.[0-9]*\.[0-9]*\]" CHANGELOG | sed -n '2p' | cut -d: -f1)

            if [ -z "$NEXT_LINE" ]; then
              sed -n "${START_LINE},\$p" CHANGELOG > changelog_section.md
            else
              END_LINE=$((NEXT_LINE - 1))
              sed -n "${START_LINE},${END_LINE}p" CHANGELOG > changelog_section.md
            fi
          fi
          echo "changelog_file=changelog_section.md" >> "$GITHUB_OUTPUT"

      - name: 🔃 Check if tag/release exists
        id: check-tag
        run: |
          VERSION="${{ steps.package-info.outputs.version }}"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            PRERELEASE=$(gh release view "$VERSION" --json isPrerelease --jq '.isPrerelease' 2>/dev/null || echo "false")
            echo "is_prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
            if [ "$PRERELEASE" = "true" ]; then
              echo "action=update_to_latest" >> "$GITHUB_OUTPUT"
              echo "Found prerelease $VERSION - will update to latest release"
            else
              echo "action=abort" >> "$GITHUB_OUTPUT"
              echo "Found stable release $VERSION - will abort"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "action=create_new" >> "$GITHUB_OUTPUT"
            echo "Tag $VERSION does not exist - will create new release"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🆕 Create New Release
        if: steps.check-tag.outputs.action == 'create_new'
        run: |
          gh release create "${{ steps.package-info.outputs.version }}" \
            --title "Release ${{ steps.package-info.outputs.version }}" \
            --notes-file changelog_section.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔄 Update Prerelease to Latest
        if: steps.check-tag.outputs.action == 'update_to_latest'
        run: |
          gh release edit "${{ steps.package-info.outputs.version }}" \
            --prerelease=false \
            --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ❌ Abort - Stable Release Already Exists
        if: steps.check-tag.outputs.action == 'abort'
        run: |
          echo "::error::Stable release ${{ steps.package-info.outputs.version }} already exists."
          exit 1

      - name: 📢 Send ClickUp Notification
        if: always()
        uses: architweb/ClickUpNotification@v3.1.0
        with:
          clickup_api_token: ${{ secrets.CLICKUP_API_TOKEN }}
          clickup_workspace_id: ${{ secrets.CLICKUP_WORKSPACE_ID }}
          clickup_channel_id: ${{ secrets.CLICKUP_CHANNEL_ID }}
          clickup_project_name: ${{ secrets.CLICKUP_PROJECT_NAME }}
          title: "Release ${{ steps.package-info.outputs.version }} Submitted"
          description: |
            **📊 Details:**
            • **Package:** "${{ steps.package-info.outputs.name }}@${{ steps.package-info.outputs.version }}"
            • **Workflow status:** ${{ job.status == 'success' && '✅ Success' || job.status == 'failure' && '❌ Failed' || '⚠️ Cancelled' }}
            • **Release status:** ${{
              steps.check-tag.outputs.action == 'create_new' && '✅ Created New Release' ||
              steps.check-tag.outputs.action == 'update_to_latest' && '🔄 Updated Prerelease to Latest' ||
              steps.check-tag.outputs.action == 'abort' && '❌ Skipped (Stable Release Exists)' ||
              '⚠️ Unknown'
            }}
            • **Release type:** ${{ steps.check-tag.outputs.is_prerelease == 'true' && '🚧 Prerelease' || '✅ Stable' }}
            ${{ job.status == 'success' && format('• **Check at:** https://github.com/architweb/ClickUpNotification/releases/tag/{0}', steps.package-info.outputs.version) || '' }}
          show_commit_statistics: "true"
