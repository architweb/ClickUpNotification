name: CI

on:
  pull_request:
  push:
    branches:
      - release/staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐚 ShellCheck
        run: shellcheck steps/*/scripts/*.sh tests/*.bash

      - name: 🧾 actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🧪 Run bats
        run: npx --yes bats@1.11.0 tests
